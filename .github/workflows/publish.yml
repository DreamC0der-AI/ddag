name: Publish to npm

# A release is a tag: pushing vX.Y.Z tests the tagged commit and publishes it to
# npm through trusted publishing (OIDC) — no token is stored anywhere, and npm
# attaches a provenance attestation that ties the tarball to this commit.
# "Run workflow" by hand does everything except the real publish (a dry run).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test, build and pack, but publish with --dry-run'
        type: boolean
        default: true

permissions:
  id-token: write # lets npm verify this workflow's identity; required for trusted publishing
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing requires a GitHub-hosted runner
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # history and tags, to see what changed since the last release

      - uses: actions/setup-node@v6
        with:
          node-version: '24' # npm >= 11.5.1 and Node >= 22.14 are required for trusted publishing
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Tool versions
        run: |
          node --version
          npm --version

      - name: The tag names the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      # The theory explorations model-check the kernel over millions of states: minutes on a
      # developer machine, a quarter of an hour here. They gate a release only when what they
      # prove could have moved: the kernel or the theory changed since the previous release tag
      # (or there is no previous tag yet).
      - name: Did the kernel or the theory change since the last release?
        id: scope
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          echo "previous release tag: ${prev:-none}"
          if [ -z "$prev" ] || [ -n "$(git diff --name-only "$prev" HEAD -- src/kernel src/theory)" ]; then
            echo "theory=true" >> "$GITHUB_OUTPUT"
          else
            echo "theory=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests (kernel laws, chain, MCP server, dashboard)
        if: steps.scope.outputs.theory == 'false'
        run: npx vitest run --exclude 'src/theory/**'

      - name: Tests, with the theory explorations
        if: steps.scope.outputs.theory == 'true'
        env:
          DDAG_TEST_TIMEOUT_SCALE: '5'
        run: npm test

      # prepublishOnly builds dist/ddag-mcp.mjs, dist/ddag-dashboard.mjs and dist/dashboard
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --access public --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public

      - name: Bundle hashes, for comparison with a local build of the same commit
        if: always()
        run: sha256sum dist/ddag-mcp.mjs dist/ddag-dashboard.mjs || true
